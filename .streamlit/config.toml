# Streamlit Community Cloud: [server] port 설정 금지 (앱 시작 실패)
# 로컬 실행은 run_server.sh / 화면실행.command 가 --server.port=8505 로 지정

[theme]
base = "light"
primaryColor = "#0F3E9C"
backgroundColor = "#EAF1FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#12233F"
font = "sans serif"

[browser]
gatherUsageStats = false
