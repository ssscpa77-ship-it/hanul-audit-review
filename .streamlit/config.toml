[theme]
base = "light"
primaryColor = "#0F3E9C"
backgroundColor = "#EAF1FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#12233F"
font = "sans serif"

[server]
address = "0.0.0.0"
port = 8505
headless = true
enableXsrfProtection = false
enableCORS = false
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false
